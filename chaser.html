<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapleTool — Midnight Chaser</title>
  <link rel="icon" type="image/png" href="images/icon.png">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <aside class="sidebar">
    <a class="brand" href="index.html">
      <img src="images/icon.png" alt="" class="brand__logo">
      <div class="brand__text">
        <strong>MapleTool</strong>
        <span>All in one helper</span>
      </div>
    </a>

    <nav class="side-nav">
      <a href="index.html" class="nav-item">Home</a>
      <a href="chaser.html" class="nav-item" aria-current="page">Midnight Chaser</a>
    </nav>

    <div class="side-time">
      <div><strong>Local:</strong> <span id="local-time">--:--:--</span></div>
      <div><strong>UTC:</strong> <span id="utc-time">--:--:--</span></div>
</div>

  </aside>

  <main class="main">
    <div class="wrap">
      <h1>Midnight Chaser <small>drag to rearrange</small></h1>

      <section class="toolbar">
        <a href="index.html" class="home-btn">← Back to Home</a>
        <button id="reset">Reset</button>
      </section>

      <div class="grid" id="grid">
        <div class="grid__container"><div class="grid__element"><img src="images/1.png" alt="1" /></div></div>
        <div class="grid__container"><div class="grid__element"><img src="images/2.png" alt="2" /></div></div>
        <div class="grid__container"><div class="grid__element"><img src="images/3.png" alt="3" /></div></div>
        <div class="grid__container"><div class="grid__element"><img src="images/4.png" alt="4" /></div></div>
        <div class="grid__container"><div class="grid__element"><img src="images/5.png" alt="5" /></div></div>
        <div class="grid__container"><div class="grid__element"><img src="images/6.png" alt="6" /></div></div>
        <div class="grid__container"><div class="grid__element"><img src="images/7.png" alt="7" /></div></div>
        <div class="grid__container"><div class="grid__element"><img src="images/8.png" alt="8" /></div></div>
        <div class="grid__container"><div class="grid__element"><img src="images/9.png" alt="9" /></div></div>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
<script>
  // highlight the current nav link automatically
  document.addEventListener("DOMContentLoaded", () => {
    const path = location.pathname.split("/").pop(); // e.g. "chaser.html"
    document.querySelectorAll(".side-nav .nav-item").forEach(link => {
      const href = link.getAttribute("href");
      link.classList.toggle("active", href === path);
    });
  });
</script>

</body>
</html>
