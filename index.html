<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Midnight Chaser — Puzzle</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>Midnight Chaser <small>drag to rearrange</small></h1>

    <section class="toolbar">

      <button id="reset">Reset</button>
    </section>

    <div class="grid" id="grid">

      <div class="grid__container"><div class="grid__element"><img src="images/1.png" alt="1" /></div></div>
      <div class="grid__container"><div class="grid__element"><img src="images/2.png" alt="2" /></div></div>
      <div class="grid__container"><div class="grid__element"><img src="images/3.png" alt="3" /></div></div>
      <div class="grid__container"><div class="grid__element"><img src="images/4.png" alt="4" /></div></div>
      <div class="grid__container"><div class="grid__element"><img src="images/5.png" alt="5" /></div></div>
      <div class="grid__container"><div class="grid__element"><img src="images/6.png" alt="6" /></div></div>
      <div class="grid__container"><div class="grid__element"><img src="images/7.png" alt="7" /></div></div>
      <div class="grid__container"><div class="grid__element"><img src="images/8.png" alt="8" /></div></div>
      <div class="grid__container"><div class="grid__element"><img src="images/9.png" alt="9" /></div></div>
    </div>
  </main>

<script src="main.js"></script>
</body>
</html>
